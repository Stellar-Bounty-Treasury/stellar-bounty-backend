name: Feature Request
description: Propose a new capability or architectural improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or enhancement for Stellar Bounty Treasury.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: A clear and concise description of the feature...
    validations:
      required: true
  - type: textarea
    id: stellar-impact
    attributes:
      label: Stellar Ecosystem Alignment
      description: How does this leverage Soroban or Stellar standards (SEPs)?
    validations:
      required: false
