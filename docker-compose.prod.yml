version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stellar-bounty-backend-prod
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    volumes:
      - production_sqlite:/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  production_sqlite:
